    <script>
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            var layerControl = document.querySelector('.leaflet-control-layers');
            if (layerControl) {
                var selectAllDiv = document.createElement('div');
                selectAllDiv.style.padding = '6px 10px 6px 6px';
                selectAllDiv.style.borderBottom = '1px solid #ddd';
                selectAllDiv.style.marginBottom = '5px';
                selectAllDiv.style.backgroundColor = '#f8f8f8';
                
                var checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'select-all-layers';
                checkbox.checked = true;
                checkbox.style.marginRight = '5px';
                
                var label = document.createElement('label');
                label.htmlFor = 'select-all-layers';
                label.innerHTML = '<b>Toggle All Layers</b>';
                label.style.cursor = 'pointer';
                label.style.fontSize = '13px';
                
                selectAllDiv.appendChild(checkbox);
                selectAllDiv.appendChild(label);
                
                var overlaysList = layerControl.querySelector('.leaflet-control-layers-overlays');
                if (overlaysList) {
                    overlaysList.insertBefore(selectAllDiv, overlaysList.firstChild);
                }
                
                checkbox.addEventListener('change', function() {
                    var checkboxes = overlaysList.querySelectorAll('input[type="checkbox"]:not(#select-all-layers)');
                    checkboxes.forEach(function(cb) {
                        if (cb.checked !== checkbox.checked) {
                            cb.click();
                        }
                    });
                });
            }
        }, 500);
    });
    </script>
